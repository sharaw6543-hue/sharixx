<!DOCTYPE html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Говь Алхам - Гутлын дэлгүүр</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="top"><a class="logo" href="#">ГОВЬ<small>АЛХАМ</small></a>
<button class="cartbtn" id="openCart" aria-label="Сагс">Сагс <b id="count">0</b></button></div>
<nav id="nav"></nav></header>
<section class="hero"><h1>Намрын хямдрал: сонгосон гутал 50% хүртэл</h1><p>Арьс, илгэн болон зангилаат материалаар хийсэн 24 загвар. Хэмжээ 39-45.</p></section>
<main><div class="tools"><input id="q" type="search" placeholder="Загвар хайх"><select id="sort"><option value="">Эрэмбэлэх</option><option value="a">Үнэ: багаас их</option><option value="d">Үнэ: ихээс бага</option><option value="s">Хямдрал эхэнд</option></select><span id="num"></span></div>
<div class="grid" id="grid"></div></main>
<footer>Говь Алхам · Улаанбаатар · Хүргэлт 24 цагийн дотор · Солих боломжтой 14 хоног</footer>
<aside id="drawer"><div class="dh"><h2>Таны сагс</h2><button id="closeCart" aria-label="Хаах">✕</button></div><div id="items"></div><div class="dt"><span>Нийт</span><b id="total">0₮</b></div><button class="buy" id="order">Захиалах</button></aside>
<script src="products.js"></script><script src="app.js"></script></body></html>
